{% extends 'accounts/base.html' %}

{% block title %}Eliminar producto - NexusShop{% endblock %}

{% block content %}
<section class="wrap">
<h1>¿Eliminar "{{ producto.nombre }}"?</h1>
<p>Esta acción no se puede deshacer.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-login">Sí, eliminar</button>
    <a href="{% url 'mis_productos' %}">Cancelar</a>
</form>
</section>
{% endblock %}

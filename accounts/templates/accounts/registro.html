{% extends 'accounts/base.html' %}

{% block title %}Registrarse - SJB Metalúrgica{% endblock %}

{% block content %}
  <section class="wrap">
    <h1>Crear cuenta</h1>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-login">Registrarme</button>
    </form>

    <p>¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
  </section>
{% endblock %}
